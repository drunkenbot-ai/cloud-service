<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}DrunkenBot AI{% endblock %}</title><meta name="description" content="{{ meta_description|default('DrunkenBot AI builds practical tools for private AI data preparation, model training, and deployment.') }}"><link rel="canonical" href="{{ request.url }}"><meta property="og:type" content="website"><meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %}"><meta property="og:description" content="{{ meta_description|default('Practical tools for building capable, private AI systems.') }}"><meta property="og:url" content="{{ request.url }}"><meta property="og:image" content="{{ request.base_url }}static/drunken_bot_logo.png"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="{{ self.title() }}"><meta name="twitter:description" content="{{ meta_description|default('Practical tools for building capable, private AI systems.') }}"><link rel="icon" href="/static/drunken_bot_logo.png">

:root{color-scheme:dark;--cyan:#19ddff;--muted:#aeb8c8}*{box-sizing:border-box}body{margin:0;color:#f5f7fb;background:#050608;font-family:Inter,ui-sans-serif,system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 5%,#12213a,transparent 42%);opacity:.8}header,main,footer{position:relative;max-width:1180px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:28px;border-bottom:1px solid #182231}.brand{color:#fff;text-decoration:none;font-weight:800;letter-spacing:.08em;white-space:nowrap}.nav{display:flex;gap:20px;align-items:center;flex:1}.nav a,.dropbtn{color:#b8c2d0;text-decoration:none;background:none;border:0;font:inherit;cursor:pointer}.nav a:hover,.dropbtn:hover{color:var(--cyan)}.dropdown{position:relative}.menu{display:none;position:absolute;z-index:4;top:28px;left:-14px;min-width:230px;padding:10px;background:#0b1018;border:1px solid #26374c;border-radius:10px}.dropdown:hover .menu,.dropdown:focus-within .menu{display:grid}.menu a{padding:9px}.hero,.page-hero,.product-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:54px;align-items:center;min-height:580px}.eyebrow{color:var(--cyan);font-size:.8rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}h1{font-size:clamp(3rem,7vw,6rem);line-height:.96;letter-spacing:-.07em;margin:18px 0}h1 em{color:var(--cyan);font-style:normal}.lead{max-width:650px;color:var(--muted);font-size:1.15rem;line-height:1.7}.button{display:inline-block;margin-top:24px;padding:13px 20px;border:1px solid #26374c;border-radius:10px;color:#eafcff;text-decoration:none;font-weight:700}.button.primary{border-color:var(--cyan);color:#031015;background:var(--cyan)}.logo-wrap{text-align:center;align-self:start;padding-top:28px}.logo-wrap img{width:min(100%,280px);border-radius:50%;filter:drop-shadow(0 0 28px #13dfff55)}
.product-carousel{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 4px 24px;scroll-behavior:smooth}.product-slide{min-width:min(78vw,330px);scroll-snap-align:start;text-decoration:none;color:inherit}.product-slide img{width:100%;height:210px;object-fit:contain;border:1px solid #26374c;border-radius:16px;background:#0b1018;transition:transform .3s ease,filter .3s ease}.product-slide:hover img{transform:translateY(-6px) scale(1.03);filter:drop-shadow(0 0 22px #13dfff55)}.product-slide h3{color:var(--cyan);margin-bottom:4px}.product-slide p{color:var(--muted);font-size:.9rem}.product-art{width:100%;max-height:390px;object-fit:contain;border-radius:16px;filter:drop-shadow(0 0 22px #13dfff35)}.founder{width:100%;max-height:520px;object-fit:contain}.details,.mission-copy{padding:45px 0;border-top:1px solid #182231}.details h2,.mission-copy h2{font-size:2rem}.details p,.mission-copy p{max-width:850px;color:var(--muted);line-height:1.8}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.detail-grid article{padding:20px;border:1px solid #1c293b;border-radius:14px;background:#0b1018cc}.detail-grid article:nth-child(3n){background-image:linear-gradient(#0b1018cc,#0b1018cc),url('/static/gpu-farm.png');background-size:cover}.detail-grid article:nth-child(3n+1){background-image:linear-gradient(#0b1018cc,#0b1018cc),url('/static/llm-ide.png');background-size:cover}.detail-grid article:nth-child(3n+2){background-image:linear-gradient(#0b1018cc,#0b1018cc),url('/static/gpu-farm-management.png');background-size:cover}.detail-grid h3{color:var(--cyan);margin-top:0}.detail-grid p{font-size:.92rem}footer{border-top:1px solid #182231;color:#8390a2;font-size:.9rem}footer a{color:var(--cyan)}@media(max-width:800px){header{flex-wrap:wrap}.nav{order:3;flex-basis:100%;overflow:auto}.hero,.page-hero,.product-hero{grid-template-columns:1fr;min-height:auto;padding:60px 0}.detail-grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.detail-grid{grid-template-columns:1fr}}
